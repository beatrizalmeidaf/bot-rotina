name: Bot de Rotina

on:
  schedule:
    # Roda a cada 5 minutos, o ano todo (GitHub Actions usa cron em UTC,
    # mas o script converte para America/Sao_Paulo internamente).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

jobs:
  checar-rotina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python bot_rotina.py --once
        env:
          ROTINA_WEBHOOK_URL: ${{ secrets.ROTINA_WEBHOOK_URL }}
