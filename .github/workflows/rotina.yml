name: Bot de Rotina

on:
  schedule:
    # Roda a cada 5 minutos (GitHub Actions usa cron em UTC, mas o script
    # converte para America/Sao_Paulo internamente). Na prática o GitHub
    # NÃO garante essa frequência para repositórios pouco ativos - por
    # isso o script tem lógica de catch-up via estado/ultimo_evento.json.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

# Necessário para o passo "Salvar checkpoint" poder dar commit/push.
permissions:
  contents: write

# Evita duas execuções mexendo no checkpoint ao mesmo tempo.
concurrency:
  group: bot-de-rotina
  cancel-in-progress: false

jobs:
  checar-rotina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python bot_rotina.py --once
        env:
          ROTINA_WEBHOOK_URL: ${{ secrets.ROTINA_WEBHOOK_URL }}

      - name: Salvar checkpoint (se mudou)
        run: |
          if git diff --quiet -- estado/; then
            echo "Checkpoint não mudou, nada para comitar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add estado/
            git commit -m "chore: atualiza checkpoint do cronograma"
            git pull --rebase origin master
            git push
          fi
