name: Bot de Rotina

on:
  schedule:
    # Reserva: o disparo de verdade (mais pontual) vem do cron-job.org
    # via workflow_dispatch. Isso aqui só garante que o resumo do dia
    # ainda sai (com atraso) se o cron-job.org falhar. O script só manda
    # o resumo perto de HORA_RESUMO (07:00) - fora dessa janela, roda e
    # não faz nada.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # disparado pelo cron-job.org (e manualmente pela aba Actions)

# Necessário para o passo "Salvar checkpoint" poder dar commit/push.
permissions:
  contents: write

# Evita duas execuções mexendo no checkpoint ao mesmo tempo.
concurrency:
  group: bot-de-rotina
  cancel-in-progress: false

jobs:
  checar-rotina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python bot_rotina.py --once
        env:
          ROTINA_WEBHOOK_URL: ${{ secrets.ROTINA_WEBHOOK_URL }}

      - name: Salvar checkpoint (se mudou)
        run: |
          # "git diff" não vê arquivo novo/nunca commitado (untracked) -
          # por isso usamos "git status --porcelain", que detecta os dois
          # casos (novo e modificado) e não dá erro se estado/ nem existir.
          mudancas=$(git status --porcelain -- estado/ 2>/dev/null)
          if [ -z "$mudancas" ]; then
            echo "Checkpoint não mudou, nada para comitar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add estado/
            git commit -m "chore: atualiza checkpoint do cronograma"
            git pull --rebase origin master
            git push
          fi
